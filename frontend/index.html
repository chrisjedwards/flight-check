<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e9f0eb" />
    <title>Flight Check | Live airport board</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/css/style.css" rel="stylesheet" />
    <script>
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)");
      document.documentElement.dataset.bsTheme = prefersDark.matches
        ? "dark"
        : "light";
      prefersDark.addEventListener("change", (event) => {
        document.documentElement.dataset.bsTheme = event.matches
          ? "dark"
          : "light";
      });
    </script>
  </head>
  <body>
    <header class="topbar">
      <div
        class="container app-shell d-flex align-items-center justify-content-between"
      >
        <a
          class="brand d-flex align-items-center gap-2"
          href="/"
          aria-label="Flight Check home"
        >
          <span class="brand-mark" aria-hidden="true">F</span>
          <span>Flight Check</span>
        </a>
        <span class="data-live"
          ><span class="live-dot" aria-hidden="true"></span> Flight
          information</span
        >
      </div>
    </header>

    <main class="container app-shell py-4 py-lg-5">
      <section
        class="page-heading d-flex flex-column flex-lg-row align-items-lg-end justify-content-between gap-3"
      >
        <div>
          <p class="eyebrow mb-2">SWEDISH AIRPORTS</p>
          <h1 class="mb-1">Flight board</h1>
          <p class="heading-copy mb-0">
            Arrivals and departures, in local time.
          </p>
        </div>
        <div class="board-meta text-lg-end">
          <span class="meta-label">LAST UPDATED</span>
          <span id="last-updated" class="meta-value" aria-live="polite">—</span>
        </div>
      </section>

      <section class="control-panel mt-4" aria-label="Flight selection">
        <div class="row g-3 align-items-end">
          <div class="col-12 col-sm-6 col-lg-3">
            <label class="form-label" for="airport-select">Airport</label>
            <select
              id="airport-select"
              class="form-select"
              autocomplete="off"
              aria-label="Select airport"
            >
              <option value="ARN">Loading airports…</option>
            </select>
          </div>
          <div class="col-8 col-sm-4 col-lg-2">
            <label class="form-label" for="date-select">Date</label>
            <input
              id="date-select"
              class="form-control"
              type="date"
              aria-label="Select date"
            />
          </div>
          <div class="col-8 col-sm-4 col-lg-2">
            <label class="form-label" for="from-time">From time</label>
            <input
              id="from-time"
              class="form-control"
              type="time"
              aria-label="Show flights from local time"
            />
          </div>
          <div class="col-4 col-sm-2 col-lg-auto">
            <button
              id="now-button"
              class="btn btn-outline-secondary now-button w-100"
              type="button"
              aria-label="Set from time to current Stockholm time"
            >
              Now
            </button>
          </div>
          <div class="col-4 col-sm-2 col-lg-auto">
            <label class="form-label d-none d-lg-block" for="refresh-button"
              >&nbsp;</label
            >
            <button
              id="refresh-button"
              class="btn btn-outline-secondary refresh-button w-100"
              type="button"
              title="Refresh flights"
            >
              <span class="refresh-symbol" aria-hidden="true">↻</span>
              <span
                id="refresh-spinner"
                class="spinner-border spinner-border-sm d-none"
                aria-hidden="true"
              ></span>
              <span class="refresh-label"> Refresh</span>
            </button>
          </div>
        </div>

        <div
          class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mt-4"
        >
          <ul
            class="nav nav-pills direction-tabs"
            role="tablist"
            aria-label="Flight direction"
          >
            <li class="nav-item" role="presentation">
              <button
                id="arrivals-tab"
                class="nav-link active"
                type="button"
                role="tab"
                aria-selected="true"
                data-direction="arrivals"
              >
                Arrivals
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button
                id="departures-tab"
                class="nav-link"
                type="button"
                role="tab"
                aria-selected="false"
                data-direction="departures"
              >
                Departures
              </button>
            </li>
          </ul>
          <div class="d-flex align-items-center gap-2 filter-control">
            <label class="form-label mb-0" for="flight-search">Search</label>
            <input
              id="flight-search"
              class="form-control form-control-sm search-input"
              type="search"
              placeholder="Flight, city, country, continent…"
              autocomplete="off"
            />
          </div>
        </div>

        <div class="row g-3 align-items-center mt-1">
          <div class="col-12 col-lg-auto">
            <div
              id="quick-filters"
              class="btn-group btn-group-sm quick-filters"
              role="group"
              aria-label="Quick flight filters"
            >
              <button
                class="btn btn-outline-secondary"
                type="button"
                data-show="all"
                aria-pressed="false"
              >
                All
              </button>
              <button
                class="btn btn-outline-secondary active"
                type="button"
                data-show="upcoming"
                aria-pressed="true"
              >
                Upcoming
              </button>
              <button
                class="btn btn-outline-secondary"
                type="button"
                data-show="delayed"
                aria-pressed="false"
              >
                Delayed
              </button>
              <button
                class="btn btn-outline-secondary"
                type="button"
                data-show="cancelled"
                aria-pressed="false"
              >
                Cancelled
              </button>
            </div>
          </div>
          <div
            class="col d-flex align-items-center justify-content-between justify-content-lg-end gap-2"
          >
            <button
              id="clear-filters"
              class="btn btn-link clear-filters p-0 d-none"
              type="button"
            >
              Clear filters
            </button>
            <p id="flight-count" class="flight-count mb-0" aria-live="polite">
              Loading flights…
            </p>
          </div>
        </div>
      </section>

      <div id="error-container" class="mt-3" aria-live="assertive"></div>
      <section
        id="flight-region"
        class="flight-region mt-3"
        aria-label="Flight results"
        aria-busy="true"
      >
        <div class="loading-state" role="status">
          <span
            class="spinner-border spinner-border-sm"
            aria-hidden="true"
          ></span>
          <span>Loading flights…</span>
        </div>
      </section>
      <div id="pagination-region" class="text-center mt-3"></div>

      <div
        id="flight-details"
        class="offcanvas offcanvas-end flight-details-panel"
        tabindex="-1"
        aria-labelledby="flight-details-title"
        aria-modal="true"
        role="dialog"
      >
        <div class="offcanvas-header details-header">
          <div>
            <p class="eyebrow mb-1">FLIGHT DETAILS</p>
            <h2 id="flight-details-title" class="offcanvas-title h4 mb-0">
              Flight
            </h2>
          </div>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="offcanvas"
            aria-label="Close"
          ></button>
        </div>
        <div id="flight-details-body" class="offcanvas-body details-body"></div>
      </div>

      <footer class="page-footer mt-5">
        Times shown in Swedish local time. Flight data: Swedavia FlightInfo API.
        Airport data: OurAirports.
      </footer>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
